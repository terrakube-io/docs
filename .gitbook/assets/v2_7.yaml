definitions:
  project:
    properties:
      type:
        type: string
        description: |-
          Create Permissions : (team manage project)
          Delete Permissions : (team manage project)
      id:
        type: string
      attributes:
        type: object
        properties:
          name:
            type: string
            description: |-
              Read Permissions : (team view project OR team project access view project)
              Update Permissions : (team manage project)
          description:
            type: string
            description: |-
              Read Permissions : (team view project OR team project access view project)
              Update Permissions : (team manage project)
          createdBy:
            type: string
            description: |-
              Read Permissions : (team view project OR team project access view project)
              Update Permissions : (team manage project)
          createdDate:
            type: string
            format: date-time
            description: |-
              Read Permissions : (team view project OR team project access view project)
              Update Permissions : (team manage project)
          updatedBy:
            type: string
            description: |-
              Read Permissions : (team view project OR team project access view project)
              Update Permissions : (team manage project)
          updatedDate:
            type: string
            format: date-time
            description: |-
              Read Permissions : (team view project OR team project access view project)
              Update Permissions : (team manage project)
      relationships:
        type: object
        properties:
          organization:
            type: object
            description: |-
              Read Permissions : (team view project OR team project access view project)
              Update Permissions : (team manage project)
            properties:
              id:
                type: string
              type:
                type: string
                enum:
                  - organization
          projectAccess:
            type: object
            description: |-
              Read Permissions : (team manage project access OR team project limited manage project access)
              Update Permissions : (team manage project OR team project admin manages project access field)
            properties:
              id:
                type: string
              type:
                type: string
                enum:
                  - project_access
  projectAccess:
    properties:
      type:
        type: string
        description: |-
          Create Permissions : (user is a superuser OR team manage project access OR team project limited manage project access)
          Delete Permissions : (user is a superuser OR team manage project access OR team project limited manage project access)
      id:
        type: string
      attributes:
        type: object
        properties:
          name:
            type: string
            description: |-
              Read Permissions : (team manage project access OR team project limited manage project access)
              Update Permissions : (user is a superuser OR team manage project access OR team project limited manage project access)
          role:
            type: string
            enum:
              - admin
              - write
              - plan
              - read
            description: |-
              Read Permissions : (team manage project access OR team project limited manage project access)
              Update Permissions : (user is a superuser OR team manage project access OR team project limited manage project access)
          manageWorkspace:
            type: boolean
            description: |-
              Read Permissions : (team manage project access OR team project limited manage project access)
              Update Permissions : (user is a superuser OR team manage project access OR team project limited manage project access)
          manageState:
            type: boolean
            description: |-
              Read Permissions : (team manage project access OR team project limited manage project access)
              Update Permissions : (user is a superuser OR team manage project access OR team project limited manage project access)
          manageJob:
            type: boolean
            description: |-
              Read Permissions : (team manage project access OR team project limited manage project access)
              Update Permissions : (user is a superuser OR team manage project access OR team project limited manage project access)
          planJob:
            type: boolean
            description: |-
              Read Permissions : (team manage project access OR team project limited manage project access)
              Update Permissions : (user is a superuser OR team manage project access OR team project limited manage project access)
          approveJob:
            type: boolean
